name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Build desktop app
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name LocalServiceAIAdFactory
          --collect-all PySide6
          app/main.py
      - name: Add quick start files
        shell: pwsh
        run: |
          @"
          本地服务 AI 广告工厂 Windows 版

          1. 确保电脑安装 FFmpeg 并加入 PATH。
          2. 双击 LocalServiceAIAdFactory.exe。
          3. AI Provider 通过系统环境变量配置，参考仓库 .env.example。
          "@ | Set-Content -Encoding UTF8 dist/LocalServiceAIAdFactory/使用说明.txt
          Copy-Item .env.example dist/LocalServiceAIAdFactory/.env.example
      - uses: actions/upload-artifact@v4
        with:
          name: LocalServiceAIAdFactory-Windows
          path: dist/LocalServiceAIAdFactory/
          if-no-files-found: error

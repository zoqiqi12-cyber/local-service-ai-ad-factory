name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Build desktop app
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name LocalServiceAIAdFactory
          --collect-all PySide6
          app/main.py
      - name: Add quick start files
        shell: pwsh
        run: |
          @"
          本地服务 AI 广告工厂 Windows 版

          1. 确保电脑安装 FFmpeg 并加入 PATH。
          2. 双击 LocalServiceAIAdFactory.exe。
          3. AI 服务可直接在软件“AI服务设置”里填写，不需要手动配置系统环境变量。
          4. 首次使用建议先生成 1 条测试片，再批量生成。
          "@ | Set-Content -Encoding UTF8 dist/LocalServiceAIAdFactory/使用说明.txt
          Copy-Item .env.example dist/LocalServiceAIAdFactory/.env.example
      - uses: actions/upload-artifact@v4
        with:
          name: LocalServiceAIAdFactory-Windows
          path: dist/LocalServiceAIAdFactory/
          if-no-files-found: error

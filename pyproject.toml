[project]
name = "local-service-ai-ad-factory"
version = "0.1.0"
description = "AI advertising factory for local service businesses"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "PySide6>=6.7",
]

[project.scripts]
ad-factory = "app.cli:main"
ad-factory-ui = "app.ui.main_window:run"
ad-factory-doctor = "app.doctor:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
